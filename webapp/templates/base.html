<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Scraping Challenge{% endblock %}</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#667085; --line:#e4e7ec; --accent:#1570ef; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
    header { background:var(--card); border-bottom:1px solid var(--line); padding:14px 24px; display:flex; gap:24px; align-items:center; flex-wrap:wrap; }
    header strong { margin-right:auto; }
    header a { color:var(--muted); text-decoration:none; font-weight:500; }
    header a.active, header a:hover { color:var(--accent); }
    main { padding:24px; max-width:1400px; margin:0 auto; }
    h1 { font-size:22px; margin:0 0 16px; }
    .muted { color:var(--muted); }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <strong>Scraping Challenge</strong>
    <a href="/" class="{{ 'active' if active is not defined }}">Overview</a>
    <a href="/cruises" class="{{ 'active' if active == 'cruises' }}">Disney Cruises</a>
    <a href="/ingredients" class="{{ 'active' if active == 'ingredients' }}">Ingredients Network</a>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
